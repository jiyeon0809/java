<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/editItem.js}"></script>
    <link th:href="@{/css/editItem.css}" rel="stylesheet">
    <title>상품 수정 페이지</title>
</head>
<body>
<div class="container">
    <a href="/main" class="logo">Team3</a>
    <h2>상품 수정</h2>

    <form id="editItemForm" class="editItem-form" enctype="multipart/form-data" th:action="@{/editItem}" method="post">
        <input type="hidden" id="itemId" name="id">

        <label>카테고리:</label>
        <select name="selectBar" id="editSelectBar">
            <option selected value="카테고리">-카테고리-</option>
            <option value="전자제품">전자제품</option>
            <option value="카테고리2">카테고리2</option>
            <option value="카테고리3">카테고리3</option>
            <option value="카테고리4">카테고리4</option>
        </select>

        <label>상품명:</label>
        <input type="text" id="editItemName" name="item" required>

        <label>가격:</label>
        <input type="text" id="editPrice" name="price" required>

        <label>제품설명:</label>
        <input type="text" id="editDetail" name="detail" required>

        <label>판매자명:</label>
        <input type="text" th:value="${userName}" id="editSeller" name="seller" readonly>

        <label>제품사진:</label>
        <input type="file" id="editImage" name="image" accept="image/*">

        <button type="submit">수정 완료</button>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/editItem.js}"></script>
</body>
</html>
